name: Build Play2Win APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore cached release keystore
        uses: actions/cache@v4
        id: cache-keystore
        with:
          path: release-key.jks
          key: play2win-release-keystore-v1

      - name: Prepare release keystore
        run: |
          if [ ! -f release-key.jks ]; then
            keytool -genkeypair -noprompt \
              -keystore release-key.jks \
              -storepass play2win123 \
              -alias upload \
              -keypass play2win123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Play2Win,O=Play2Win,C=IN"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          STORE_PASSWORD: play2win123
          KEY_PASSWORD: play2win123
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign APK with v1, v2, and v3 schemes
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias upload \
            --ks-pass pass:play2win123 \
            --key-pass pass:play2win123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Play2Win.apk \
            app/build/outputs/apk/release/app-release.apk
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose Play2Win.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Play2Win-APK
          path: Play2Win.apk

      - name: Publish Direct APK Release Link
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Play2Win.apk --clobber
          else
            gh release create latest Play2Win.apk --target "${{ github.sha }}" --title "Play2Win APK" --notes "Latest Play2Win Android APK"
          fi
